name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            openjdk-17-jdk \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Build with Buildozer (with retry mechanism)
      run: |
        for i in {1..3}; do
          echo "Attempt $i to build..."
          buildozer -v android debug && break || \
          if [ $i -eq 3 ]; then exit 1; fi
          echo "Build failed due to network/download issue, retrying in 10 seconds..."
          sleep 10
        done

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
