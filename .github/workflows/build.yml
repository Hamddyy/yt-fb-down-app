name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5:i386 \
            libstdc++6:i386 \
            zlib1g:i386 \
            openjdk-17-jdk \
            build-essential \
            ccache \
            libffi-dev \
            libssl-dev

    - name: Setup exact SDK structure for Buildozer
      run: |
        # 1. إنشاء المسار الافتراضي الذي يبحث فيه Buildozer بدقة
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR/tools/bin
        
        # 2. تحميل أدوات سطر الأوامر وفكها مباشرة داخل مجلد tools القديم ليتطابق مع طلب البناء
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d temp_tools
        
        # نقل المحتويات لتتوافق مع الهيكل القديم (tools/bin/sdkmanager)
        cp -r temp_tools/cmdline-tools/bin/* $SDK_DIR/tools/bin/
        cp -r temp_tools/cmdline-tools/lib $SDK_DIR/tools/
        rm -rf cmdline-tools.zip temp_tools
        
        # 3. قبول التراخيص وتشغيل التثبيت التلقائي للأدوات اللازمة عبر الهيكل المنشأ
        export ANDROID_HOME=$SDK_DIR
        export PATH=$PATH:$SDK_DIR/tools/bin:$SDK_DIR/platform-tools
        
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Build with Buildozer
      run: |
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
